<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patrik Söderberg</title>
  <style>
    :root { --bg: #f6f7f9; --text: #15191e; --muted: #5d6670; --card: #fff; --border: #e3e6ea; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d1014; --text: #e8ecf0; --muted: #98a2ad; --card: #161a20; --border: #262c34; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 56px 16px; }
    h1 { margin: 0 0 4px; font-size: 1.8rem; }
    p.lead { margin: 0 0 32px; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .card h2 { margin: 0 0 6px; font-size: 1.1rem; }
    .card p { margin: 0; color: var(--muted); }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Patrik Söderberg</h1>
    <p class="lead">Personliga verktyg och projekt.</p>

    <div class="card">
      <h2>rclone turbo</h2>
      <p>Privat säkerhetskopiering av min egen dator till mitt eget Google Drive-konto, med
        <a href="https://rclone.org/">rclone</a> och <a href="https://restic.net/">restic</a>.
        Används bara av mig. <a href="privacy.html">Integritetspolicy</a>.</p>
    </div>
  </main>
</body>
</html>
